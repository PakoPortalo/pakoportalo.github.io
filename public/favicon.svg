<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 60 904 904">
  <!--
    El logotipo: un asterisco de cuatro trazos de pincel, en el verde neón
    de la web (#5ff7c6), con su brillo: un halo difuso del mismo color por
    detrás y el trazo nítido encima.
  -->
  <defs>
    <filter id="brillo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="26" result="difuso" />
      <feComponentTransfer in="difuso" result="halo">
        <feFuncA type="linear" slope="0.75" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="halo" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#brillo)" fill="none" stroke="#5ff7c6" stroke-width="74" stroke-linecap="round" stroke-linejoin="round">
    <path d="M392 178 C 418 320, 452 470, 470 560 S 512 760, 522 846" />
    <path d="M158 520 C 300 496, 470 470, 600 448 S 760 420, 812 412" />
    <path d="M672 252 C 600 340, 520 440, 450 520 S 300 660, 248 714" />
    <path d="M212 318 C 330 400, 460 480, 560 560 S 700 660, 760 692" />
  </g>
</svg>
